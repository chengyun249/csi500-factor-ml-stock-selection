[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csi500-factor-research"
version = "2.0.0"
description = "Point-in-time CSI 500 factor and machine-learning research"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.3,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "tqdm>=4.66,<5",
  "tushare>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
